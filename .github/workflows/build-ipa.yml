name: Build iOS IPA

on:
  push:
    branches: [main, ios-port]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache ios-deps
        uses: actions/cache@v4
        with:
          path: BionicSX2/ios-deps/install
          key: ios-deps-${{ hashFiles('scripts/build_ios_deps.sh') }}

      - name: Install Dependencies
        run: |
          brew install cmake ninja

      - name: Build third-party deps for iOS
        run: |
          chmod +x scripts/build_ios_deps.sh
          bash scripts/build_ios_deps.sh

      - name: Generate CMake Files
        run: |
          cmake -S BionicSX2 -B build-ios \
            -DCMAKE_TOOLCHAIN_FILE=cmake/ios.toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -G Ninja

      - name: Build BionicSX2
        working-directory: build-ios
        run: |
          cmake --build . --config Release -j$(sysctl -n hw.logicalcpu) 2>&1 | tee build.log

      - name: Package IPA
        run: |
          # Create export options plist for unsigned dev build
          cat > exportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>teamID</key>
              <string></string>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath build-ios/BionicSX2.xcarchive \
            -exportPath build-ios/BionicSX2.ipa \
            -exportOptionsPlist exportOptions.plist \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" || true

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v7
        with:
          name: BionicSX2-iOS
          path: build-ios/BionicSX2.ipa

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: build-ios/build.log
