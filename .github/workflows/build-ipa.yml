name: Build iOS IPA

on:
  push:
    branches: [main, ios-port]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache ios-deps
        uses: actions/cache@v4
        with:
          path: BionicSX2/ios-deps/install
          key: ios-deps-${{ hashFiles('scripts/build_ios_deps.sh') }}

      - name: Install Dependencies
        run: |
          brew install cmake ninja

      - name: Build third-party deps for iOS
        run: |
          chmod +x scripts/build_ios_deps.sh
          bash scripts/build_ios_deps.sh

      - name: Generate CMake Files
        run: |
          cmake -S BionicSX2 -B build-ios \
            -DCMAKE_TOOLCHAIN_FILE=cmake/ios.toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -G Ninja

      - name: Build BionicSX2
        working-directory: build-ios
        run: |
          cmake --build . --config Release -j$(sysctl -n hw.logicalcpu) > build.log 2>&1
          exit_code=$?
          cat build.log
          exit $exit_code

      - name: Package IPA
        run: |
          cd build-ios
          mkdir -p Payload
          cp -R BionicSX2.app Payload/
          zip -r BionicSX2.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v7
        with:
          name: BionicSX2-iOS
          path: build-ios/BionicSX2.ipa

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: build-ios/build.log
